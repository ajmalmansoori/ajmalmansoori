<!-- =========================
        COURSES SECTION
========================== -->

<section class="courses-section">

    <div class="courses-container">

        <!-- Hero -->

        <div class="courses-hero">

            <div class="hero-left">

                <span class="hero-badge">
                    OUR COURSES
                </span>

                <h1>
                    Explore Our <br>
                    <span>Premium Courses</span>
                </h1>

                <p>
                    High quality courses designed to help students crack
                    Entrance Exams, Government Jobs and University Admissions.
                </p>

                <div class="hero-features">

                    <div class="feature">
                        <i class="fa-solid fa-user-graduate"></i>
                        Expert Teachers
                    </div>

                    <div class="feature">
                        <i class="fa-solid fa-infinity"></i>
                        Lifetime Access
                    </div>

                    <div class="feature">
                        <i class="fa-solid fa-certificate"></i>
                        Certificate
                    </div>

                    <div class="feature">
                        <i class="fa-solid fa-mobile-screen"></i>
                        Mobile Friendly
                    </div>

                </div>

            </div>

            <div class="hero-right">

                <img src="images/course-hero.png" alt="Courses">

            </div>

        </div>

    </div>

</section>



<!-- =========================
        FILTER BAR
========================== -->

<section class="course-filter-section">

    <div class="courses-container">

        <div class="filter-wrapper">

            <div class="filter-buttons">

                <button class="active" data-filter="all">
                    All Courses
                </button>

                <button data-filter="entrance">
                    Entrance Exams
                </button>

                <button data-filter="govt">
                    Government Jobs
                </button>

                <button data-filter="competitive">
                    Competitive Exams
                </button>

                <button data-filter="academic">
                    Academic
                </button>

            </div>

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    id="courseSearch"
                    placeholder="Search courses..."
                >

            </div>

        </div>

    </div>

</section>



<!-- =========================
        COURSE GRID
========================== -->

<section class="courses-grid">

    <div class="courses-container">

        <div class="course-wrapper">

            <!-- Part 2 me cards ayenge -->

        </div>

    </div>
